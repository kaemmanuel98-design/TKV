<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('tkv-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#f0ebe0" />
    <meta name="description" content="The Kingdom's Voice — Explorer la foi avec rigueur et bienveillance. Pour les curieux, les sceptiques et les croyants." />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
    <title>TKV — The Kingdom's Voice</title>
  </head>
  <body>
    <div id="root">
      <style>
        #root:empty {
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          background: #f0ebe0;
        }
        #root:empty::after {
          content: '';
          width: 28px;
          height: 28px;
          border: 2px solid rgba(184, 134, 42, 0.2);
          border-top-color: #b8862a;
          border-radius: 50%;
          animation: tkv-boot-spin 0.75s linear infinite;
        }
        @keyframes tkv-boot-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
